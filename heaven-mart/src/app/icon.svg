<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Heaven Furniture Mart">
  <!--
    THE MARK, at 16 px.

    A favicon is a 16 px tile in a strip of twenty other 16 px tiles. Two
    things decide whether it is found: how bright it is against a browser
    chrome that is white or near-black, and whether the shape survives being
    four pixels wide. So this is BRASS GROUND, ink glyph - the inverse of the
    page - because a warm gold square is the only thing in a tab strip full
    of white cards and blue circles that reads as a brand rather than a
    document.

    The glyph is the H of HEAVEN, drawn in the header's own proportions
    (Inter Tight 700: heavy stems, crossbar a touch above optical centre)
    with the wordmark's triangle set into the counter as a serif nobody sees
    at 16 px and everybody sees at 180 px on a home screen.

    Drawn, not exported: ~600 bytes, crisp at every size, and built from the
    two brand values (brass #B08D57, ink #0B0C0C) so it can never drift
    out of step with the header.

    If the client supplies their real logotype, replace this file and
    src/app/apple-icon.png. Next picks both up by filename.
  -->
  <rect width="64" height="64" rx="13" fill="#B08D57"/>
  <!-- the H: two stems and a crossbar, one path so the counter can be cut -->
  <path fill="#0B0C0C" d="M15 14h9.5v14.5h15V14H49v36h-9.5V35.5h-15V50H15z"/>
  <!-- the wordmark's triangle, set in the crossbar. Invisible at 16 px,
       which is the point: the tile must not be busy where it is small. -->
  <path fill="#B08D57" d="M32 26.4l4.6 8.1h-9.2z"/>
</svg>
